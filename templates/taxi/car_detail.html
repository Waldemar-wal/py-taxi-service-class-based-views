{% extends "base.html" %}

{% block content %}
  <h1>Car: {{ car.model }}</h1>
  <p>Manufacturer: {{ manufacturer.name }} from {{ manufacturer.country }}</p>
  <ul>
  {% for driver in car.driver.all %}
    <li>{{ driver.first_name }} {{ driver.last_name }}</li>
  {% empty %}
    <p>No drivers!</p>
  {% endfor %}
  </ul>
{% endblock %}
